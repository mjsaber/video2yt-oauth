<h1>video2yt</h1>
<p>這是 YouTube 頻道「馬哥爐石復盤」自用的影片發布工具（單一使用者的桌面 CLI）。它只在頻道擁有者自己的電腦上執行，用來上傳影片、設定縮圖、加入播放清單與發布留言。</p>
<p>本工具不對外提供服務，也不收集任何第三方使用者的資料。</p>
